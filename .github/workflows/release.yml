name: Build and Deploy Release

# 1. This tells GitHub to ONLY run this script when you push a version tag (like v1.0.0) or run manually
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    # We use a standard Windows runner because we are compiling a WinForms application
    runs-on: windows-latest

    steps:
    # Step 1: Pull down your source code from the repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Set up the official .NET SDK environment on the runner
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Updates automatically to the latest patch release

    # Step 3: Clean up and restore NuGet packages
    - name: Restore Dependencies
      run: dotnet restore

    # Step 4: Install Obfuscar global tool
    - name: Install Obfuscar Tool
      run: dotnet tool install --global Obfuscar.GlobalTool

    # Step 5: Stage raw assemblies for obfuscation (loose DLLs)
    - name: Stage Unbundled Binaries
      run: |
        dotnet publish TreasuryToolkit.App/TreasuryToolkit.App.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=false -o ./staging

    # Step 6: Obfuscate the staged assemblies
    - name: Run Obfuscation
      run: |
        cd TreasuryToolkit.App
        obfuscar.console obfuscar.xml

    # Step 7: Overwrite staged assembly with obfuscated version and bundle into single .exe
    - name: Compile Single Executable Suite
      run: |
        copy /Y staging\obfuscated\TreasuryToolkit.dll staging\TreasuryToolkit.dll
        dotnet publish TreasuryToolkit.App/TreasuryToolkit.App.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:PublishReadyToRun=true --no-build -o ./publish

    # Step 8: 🔏 CODE SIGN THE PUBLISHED EXECUTABLE 🔏        
    - name: Code Sign Executable
      uses: dlemstra/code-sign-action@v1
      with:
        certificate: '${{ secrets.BASE64_CODE_SIGNING_CERT }}'
        password: '${{ secrets.CODE_SIGNING_PASSWORD }}'
        folder: './publish'
        files: 'TreasuryToolkit.exe'

    # Step 9: Automatically create a GitHub Release and upload the solitary .exe file
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ./publish/TreasuryToolkit.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
