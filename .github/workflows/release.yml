name: Build and Deploy Release

# 1. This tells GitHub to ONLY run this script when you push a version tag (like v1.0.0) or run manually
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    # We use a standard Windows runner because we are compiling a WinForms application
    runs-on: windows-latest

    steps:
    # Step 1: Pull down your source code from the repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Set up the official .NET SDK environment on the runner
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Updates automatically to the latest patch release

    # Step 3: Derive the version from the tag (v1.2.3 or v1.2.3-beta.1). VersionPrefix (numbers only)
    # feeds AssemblyVersion and the exe's File Version; Version (prefix + optional suffix) becomes
    # the Product Version. Manual runs have no tag, so they get an obvious 0.0.0-dev.<run> version.
    - name: Determine Version
      shell: pwsh
      run: |
        if ($env:GITHUB_REF_TYPE -eq 'tag') {
          if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)(?:-([0-9A-Za-z.-]+))?$') {
            Write-Error "Tag '$env:GITHUB_REF_NAME' is not in the form v1.2.3 or v1.2.3-suffix"
            exit 1
          }
          $prefix = $Matches[1]
          $suffix = $Matches[2]
        } else {
          $prefix = '0.0.0'
          $suffix = "dev.$env:GITHUB_RUN_NUMBER"
        }
        $version = if ($suffix) { "$prefix-$suffix" } else { $prefix }
        Write-Host "Building version $version (file version $prefix.0)"
        "VERSION_PREFIX=$prefix" >> $env:GITHUB_ENV
        "VERSION=$version" >> $env:GITHUB_ENV

    # Step 4: Clean up and restore NuGet packages
    - name: Restore Dependencies
      run: dotnet restore

    # Step 4b: Run the parser tests (TreasuryToolkit.Infra.Tests) before anything is built for release,
    # so a change that breaks field extraction never gets signed or published. global.json opts
    # dotnet test into Microsoft.Testing.Platform, which xUnit v3 needs on the .NET 10 SDK.
    - name: Run Tests
      run: dotnet test --project TreasuryToolkit.Infra.Tests/TreasuryToolkit.Infra.Tests.csproj -c Release --no-restore

    # Step 5: Build + stage raw assemblies of the v2 WPF app (TreasuryToolkit.Wpf.App). Unlike the v1
    # project, it has no Obfuscar target (bindings resolve ViewModel property names at runtime, so
    # obfuscation would break them).
    # PublishReadyToRun=true must be passed here too (not just on the --no-build publish below)
    # so this step's restore resolves the win-x64 crossgen2 package; --no-build implies
    # --no-restore, so the later step can't fetch it on its own (NETSDK1094 otherwise).
    # The version properties are passed to both publish steps so the assemblies and the bundled
    # exe agree. (The csproj keeps the commit sha out of the Product Version.)
    - name: Stage Unbundled Binaries
      run: |
        dotnet publish TreasuryToolkit.Wpf.App/TreasuryToolkit.Wpf.App.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=false /p:PublishReadyToRun=true /p:Version=$env:VERSION /p:AssemblyVersion="$env:VERSION_PREFIX.0" /p:FileVersion="$env:VERSION_PREFIX.0" -o ./staging

    # Step 6: Bundle the build output from the step above into a single .exe (--no-build reuses it).
    # IncludeNativeLibrariesForSelfExtract=true is required for WPF: without it, its native DLLs
    # (wpfgfx_cor3, PresentationNative_cor3, D3DCompiler_47_cor3, ...) are left next to the exe instead
    # of inside it, and the exe can't start on its own.
    - name: Compile Single Executable Suite
      run: |
        dotnet publish TreasuryToolkit.Wpf.App/TreasuryToolkit.Wpf.App.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:PublishReadyToRun=true /p:Version=$env:VERSION /p:AssemblyVersion="$env:VERSION_PREFIX.0" /p:FileVersion="$env:VERSION_PREFIX.0" --no-build -o ./publish

    # Fail early if anything besides the exe was left behind (e.g. a native DLL that wasn't bundled);
    # the zip below only ships TreasuryToolkit.exe, so such a file would be silently missing for users
    - name: Check Single-File Output
      run: |
        $extra = Get-ChildItem ./publish -File | Where-Object { $_.Name -ne 'TreasuryToolkit.exe' -and $_.Extension -ne '.pdb' }
        if ($extra) {
          Write-Error "Files left next to the exe: $($extra.Name -join ', ')"
          exit 1
        }

    # Step 7: 🔏 CODE SIGN THE PUBLISHED EXECUTABLE 🔏
    - name: Code Sign Executable
      uses: dlemstra/code-sign-action@v1
      with:
        certificate: '${{ secrets.BASE64_CODE_SIGNING_CERT }}'
        password: '${{ secrets.CODE_SIGNING_PASSWORD }}'
        folder: './publish'
        files: 'TreasuryToolkit.exe'

    # Step 8: Zip the signed exe. Edge's SmartScreen download-reputation check ("isn't commonly
    # downloaded") targets directly-executable extensions like .exe; shipping a .zip avoids that
    # in-browser warning. (The OS-level SmartScreen prompt on first run is separate and untouched
    # by this - it still checks the exe's own cert/file reputation when the user runs it.)
    - name: Zip Release Asset
      run: Compress-Archive -Path ./publish/TreasuryToolkit.exe -DestinationPath ./publish/TreasuryToolkit.zip

    # Manual runs don't create a release, so keep the build downloadable from the run page instead
    - name: Upload Build Artifact
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: actions/upload-artifact@v4
      with:
        name: TreasuryToolkit-${{ env.VERSION }}
        path: ./publish/TreasuryToolkit.zip

    # Step 9: Automatically create a GitHub Release and upload the zipped .exe file. Tags with a suffix
    # (v2.0.0-beta.1) become prereleases, so they never show up as the latest release for v1 users.
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ./publish/TreasuryToolkit.zip
        prerelease: ${{ contains(github.ref_name, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
