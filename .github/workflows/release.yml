name: Build and Deploy Release

# 1. This tells GitHub to ONLY run this script when you push a version tag (like v1.0.0) or run manually
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    # We use a standard Windows runner because we are compiling a WinForms application
    runs-on: windows-latest

    steps:
    # Step 1: Pull down your source code from the repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Set up the official .NET SDK environment on the runner
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Updates automatically to the latest patch release

    # Step 3: Clean up and restore NuGet packages
    - name: Restore Dependencies
      run: dotnet restore

    # Step 4: Build + stage raw assemblies. Obfuscation runs automatically here via the
    # ObfuscateAssemblies MSBuild target (TreasuryToolkit.App.csproj, AfterTargets="Build",
    # Configuration=Release) which invokes Obfuscar against $(TargetDir) using
    # TreasuryToolkit.App/obfuscar.xml before these files get copied to ./staging.
    # PublishReadyToRun=true must be passed here too (not just on the --no-build publish below)
    # so this step's restore resolves the win-x64 crossgen2 package; --no-build implies
    # --no-restore, so the later step can't fetch it on its own (NETSDK1094 otherwise).
    - name: Stage Unbundled Binaries
      run: |
        dotnet publish TreasuryToolkit.App/TreasuryToolkit.App.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=false /p:PublishReadyToRun=true -o ./staging

    # Step 5: Bundle the already-obfuscated build output into a single .exe (--no-build reuses
    # the output from the step above, so it does not re-run Compile/obfuscation).
    - name: Compile Single Executable Suite
      run: |
        dotnet publish TreasuryToolkit.App/TreasuryToolkit.App.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:PublishReadyToRun=true --no-build -o ./publish

    # Step 6: 🔏 CODE SIGN THE PUBLISHED EXECUTABLE 🔏
    - name: Code Sign Executable
      uses: dlemstra/code-sign-action@v1
      with:
        certificate: '${{ secrets.BASE64_CODE_SIGNING_CERT }}'
        password: '${{ secrets.CODE_SIGNING_PASSWORD }}'
        folder: './publish'
        files: 'TreasuryToolkit.exe'

    # Step 7: Zip the signed exe. Edge's SmartScreen download-reputation check ("isn't commonly
    # downloaded") targets directly-executable extensions like .exe; shipping a .zip avoids that
    # in-browser warning. (The OS-level SmartScreen prompt on first run is separate and untouched
    # by this - it still checks the exe's own cert/file reputation when the user runs it.)
    - name: Zip Release Asset
      run: Compress-Archive -Path ./publish/TreasuryToolkit.exe -DestinationPath ./publish/TreasuryToolkit.zip

    # Step 8: Automatically create a GitHub Release and upload the zipped .exe file
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ./publish/TreasuryToolkit.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
